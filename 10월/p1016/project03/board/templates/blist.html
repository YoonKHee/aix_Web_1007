<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,tr,td{border: 1px solid black; border-collapse: collapse;}
        td,th{width: 150px; height: 40px;}
        img{width: 100px; }
    </style>
</head>
<body>
    <h1>게시판리스트</h1>
    <table>
        <tr>
            <td>제목</td>
            <td>이미지이름</td>
            <td>이미지보기</td>
        </tr>
        {% for board in list %}
        <tr>
            <td>{{board.btitle}}</td>
            <td>{{board.bfile}}</td>
            <td><img src="{{board.bfile.url}}" alt=""></td>
            <td><img src="/media/{{board.bfile}}" alt=""></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
