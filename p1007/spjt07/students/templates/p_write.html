<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>뉴스 글쓰기</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans KR", Arial, sans-serif;
            color: #333;
            background: #fff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            border-bottom: 1px solid #eee;
        }

        .top {
            width: 1200px;
            height: 90px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .menu {
            display: flex;
            gap: 40px;
        }

        .menu li {
            font-size: 15px;
        }

        .menu li:hover {
            color: #777;
        }


        /* =========================
           VISUAL
        ========================= */

        .visual {
            width: 100%;
            height: 280px;

            background:
                linear-gradient(
                    rgba(0, 0, 0, .25),
                    rgba(0, 0, 0, .25)
                ),
                url("https://images.unsplash.com/photo-1506744038136-46273834b3fb")
                center / cover no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            color: white;
        }

        .visual h1 {
            font-size: 42px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .visual p {
            margin-top: 15px;
            font-size: 15px;
        }


        /* =========================
           CONTENT
        ========================= */

        .container {
            width: 1200px;
            margin: 0 auto;

            padding: 70px 0 100px;
        }


        /* BREADCRUMB */

        .breadcrumb {
            margin-bottom: 40px;

            color: #999;
            font-size: 13px;
        }

        .breadcrumb span {
            margin: 0 10px;
        }


        /* PAGE TITLE */

        .page-title {
            margin-bottom: 35px;
        }

        .page-title h2 {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -1px;
        }


        /* =========================
           WRITE FORM
        ========================= */

        .write-form {
            border-top: 2px solid #333;
        }


        /* FORM ROW */

        .form-row {
            display: flex;

            min-height: 65px;

            border-bottom: 1px solid #eee;
        }

        .form-label {
            width: 150px;

            display: flex;
            align-items: center;

            padding-left: 20px;

            background: #fafafa;

            font-size: 14px;
            font-weight: 500;
        }

        .form-input {
            flex: 1;

            display: flex;
            align-items: center;

            padding: 10px 15px;
        }


        /* INPUT */

        .form-input input[type="text"],
        .form-input input[type="password"] {
            width: 100%;
            max-width: 600px;

            height: 42px;

            padding: 0 12px;

            border: 1px solid #ddd;

            outline: none;

            font-family: inherit;
            font-size: 14px;
        }

        .form-input input:focus,
        .form-input textarea:focus {
            border-color: #777;
        }


        /* AUTHOR */

        .author-input {
            max-width: 300px !important;
        }

        .password-input {
            max-width: 300px !important;
        }


        /* CATEGORY */

        .category-select {
            width: 180px;

            height: 42px;

            padding: 0 10px;

            border: 1px solid #ddd;

            font-family: inherit;

            background: white;
        }


        /* IMAGE */

        .image-input {
            padding: 15px;
        }

        .image-input input {
            font-family: inherit;
            font-size: 13px;
        }

        .image-guide {
            margin-left: 15px;

            color: #999;
            font-size: 12px;
        }


        /* CONTENT */

        .content-row {
            align-items: stretch;
        }

        .content-row .form-label {
            align-items: flex-start;

            padding-top: 20px;
        }

        .content-input {
            padding: 15px;
        }

        .content-input textarea {
            width: 100%;
            height: 400px;

            padding: 15px;

            resize: vertical;

            border: 1px solid #ddd;

            outline: none;

            font-family: inherit;
            font-size: 14px;
            line-height: 1.8;
        }


        /* =========================
           FILE
        ========================= */

        .file-input {
            display: flex;
            align-items: center;
        }

        .file-input input[type="file"] {
            font-family: inherit;
            font-size: 13px;
        }


        /* =========================
           BUTTON
        ========================= */

        .button-area {
            display: flex;
            justify-content: center;
            gap: 5px;

            margin-top: 30px;
        }

        .btn {
            display: inline-flex;

            min-width: 100px;
            height: 44px;

            align-items: center;
            justify-content: center;

            padding: 0 20px;

            border: 1px solid #ccc;

            background: white;

            font-family: inherit;
            font-size: 13px;

            cursor: pointer;

            transition: .3s;
        }

        .btn:hover {
            background: #f5f5f5;
        }

        .btn-dark {
            background: #333;
            color: white;
            border-color: #333;
        }

        .btn-dark:hover {
            background: #555;
        }

        .btn-cancel {
            background: #777;
            color: white;
            border-color: #777;
        }

        .btn-cancel:hover {
            background: #555;
        }


        /* =========================
           REQUIRED
        ========================= */

        .required {
            color: #d44;

            margin-left: 3px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #333;
            color: #aaa;
        }

        .footer-inner {
            width: 1200px;
            margin: 0 auto;

            padding: 45px 0;
        }

        .footer-menu {
            display: flex;
            gap: 25px;

            margin-bottom: 25px;
        }

        .footer-menu a {
            color: #ddd;
            font-size: 13px;
        }

        .footer-info {
            font-size: 12px;
            line-height: 2;
        }


        /* =========================
           MOBILE
        ========================= */

        @media screen and (max-width: 768px) {

            .top,
            .container,
            .footer-inner {
                width: 90%;
            }

            .menu {
                display: none;
            }

            .visual {
                height: 220px;
            }

            .visual h1 {
                font-size: 32px;
            }

            .container {
                padding-top: 45px;
            }

            .form-row {
                flex-direction: column;
            }

            .form-label {
                width: 100%;

                min-height: 45px;

                padding-left: 15px;
            }

            .form-input {
                min-height: 60px;

                padding: 10px;
            }

            .content-row .form-label {
                padding-top: 12px;
            }

            .content-input textarea {
                height: 300px;
            }

            .image-guide {
                display: none;
            }

            .button-area {
                width: 100%;
            }

            .button-area .btn {
                flex: 1;
            }

        }

    </style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="top">

        <div class="logo">
            FOREST
        </div>


        <ul class="menu">

            <li>
                <a href="#">소개</a>
            </li>

            <li>
                <a href="#">뉴스</a>
            </li>

            <li>
                <a href="#">객실</a>
            </li>

            <li>
                <a href="#">스파</a>
            </li>

            <li>
                <a href="#">특별한 경험</a>
            </li>

            <li>
                <a href="#">부대시설</a>
            </li>

            <li>
                <a href="#">예약</a>
            </li>

        </ul>

    </div>

</header>


<!-- =========================
     VISUAL
========================= -->

<section class="visual">

    <div>

        <h1>NEWS</h1>

        <p>
            포레스트의 새로운 소식을 만나보세요.
        </p>

    </div>

</section>


<!-- =========================
     CONTENT
========================= -->

<main>

    <div class="container">


        <!-- BREADCRUMB -->

        <div class="breadcrumb">

            HOME

            <span>></span>

            FOREST

            <span>></span>

            NEWS

            <span>></span>

            WRITE

        </div>


        <!-- PAGE TITLE -->

        <div class="page-title">

            <h2>
                글쓰기
            </h2>

        </div>


        <!-- =========================
             WRITE FORM
        ========================= -->

        <form
            class="write-form"
            action="#"
            method="post"
            enctype="multipart/form-data"
        >


            <!-- CATEGORY -->

            <div class="form-row">

                <div class="form-label">
                    분류
                    <span class="required">*</span>
                </div>

                <div class="form-input">

                    <select
                        class="category-select"
                        name="category"
                    >

                        <option value="forest">
                            FOREST
                        </option>

                        <option value="news">
                            NEWS
                        </option>

                        <option value="notice">
                            공지사항
                        </option>

                    </select>

                </div>

            </div>


            <!-- TITLE -->

            <div class="form-row">

                <div class="form-label">

                    제목

                    <span class="required">
                        *
                    </span>

                </div>


                <div class="form-input">

                    <input
                        type="text"
                        name="title"
                        placeholder="제목을 입력하세요."
                        required
                    >

                </div>

            </div>


            <!-- AUTHOR -->

            <div class="form-row">

                <div class="form-label">

                    작성자

                    <span class="required">
                        *
                    </span>

                </div>


                <div class="form-input">

                    <input
                        type="text"
                        name="author"
                        class="author-input"
                        placeholder="작성자"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-row">

                <div class="form-label">

                    비밀번호

                    <span class="required">
                        *
                    </span>

                </div>


                <div class="form-input">

                    <input
                        type="password"
                        name="password"
                        class="password-input"
                        placeholder="비밀번호"
                        required
                    >

                </div>

            </div>


            <!-- IMAGE -->

            <div class="form-row">

                <div class="form-label">
                    대표 이미지
                </div>


                <div class="form-input image-input">

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                    >

                    <span class="image-guide">
                        JPG, PNG, WEBP 이미지
                    </span>

                </div>

            </div>


            <!-- CONTENT -->

            <div class="form-row content-row">

                <div class="form-label">

                    내용

                    <span class="required">
                        *
                    </span>

                </div>


                <div class="form-input content-input">

                    <textarea
                        name="content"
                        placeholder="내용을 입력하세요."
                        required
                    ></textarea>

                </div>

            </div>


            <!-- FILE -->

            <div class="form-row">

                <div class="form-label">
                    첨부파일
                </div>


                <div class="form-input file-input">

                    <input
                        type="file"
                        name="file"
                    >

                </div>

            </div>


            <!-- =========================
                 BUTTON
            ========================= -->

            <div class="button-area">

                <a
                    href="#"
                    class="btn"
                >
                    목록
                </a>


                <a
                    href="#"
                    class="btn btn-cancel"
                >
                    취소
                </a>


                <button
                    type="submit"
                    class="btn btn-dark"
                >
                    등록
                </button>

            </div>


        </form>

    </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <div class="footer-inner">


        <div class="footer-menu">

            <a href="#">
                회사소개
            </a>

            <a href="#">
                오시는 길
            </a>

            <a href="#">
                개인정보처리방침
            </a>

            <a href="#">
                이용약관
            </a>

            <a href="#">
                이메일무단수집거부
            </a>

        </div>


        <div class="footer-info">

            포레스트 리조트<br>

            충청북도 제천시 백운면 금봉로 365<br>

            대표번호 : 043-649-6000

        </div>


    </div>

</footer>


</body>
</html>
