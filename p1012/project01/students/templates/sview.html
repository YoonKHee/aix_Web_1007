<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function updateBtn(){
            {% comment %} alert('확인') {% endcomment %}
            if (confirm('학생정보수정합니까'))
            location.href='/students/supdate/{{stu.name}}/'
        }
        function deleteBtn(){
            {% comment %} alert('확인') {% endcomment %}
            if (confirm('학생정보삭제합니까'))
            location.href='/students/sdelete/{{stu.name}}/'
        }
    </script>
</head>
<body>
    <h1>학생상세보기</h1>
    <form action='/students/sview/' name='frm' method='post'>
        {# 디장고 주석 : {% for,if %}   {{name}} #}
        {% csrf_token %}
        <label>이름</label>
        {{stu.name}}<br>
        <label>학과</label>
        <div>{{stu.major}}</div><br>
        <label>나이</label>
        {{stu.age}}<br>
        <label>학년</label>
        {{stu.grade}}<br>
        <label>성별</label><br>
        {{stu.gender}}<br>
        <a href='/students/slist/'><button type='button'>리스트</button></a>
        <button type='button' onclick='updateBtn()'>수정</button></a>
        <button type='button' onclick='deleteBtn()'>삭제</button></a>
        <a href='/'><button type='button'>홈으로</button></a>
        <br>


    </form>
</body>
</html>
