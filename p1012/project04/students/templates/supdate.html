<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>학생성적입력</h1>
    <form action="/students/supdate/{{stu.name}}/" name=frm method="post">
        {#{% for,if %}   {{name}}#}
        {% csrf_token %}
        <label for="">이름</label>
        <input type="text" name=name id='name' value={{stu.name}}>
        <br>
        <label for="">학과</label>
        <input type="text" name=major id='major' value={{stu.major}}>
        <br>
        <label for="">학년</label>
        <input type="text" name=grade id='grade' value={{stu.grade}}>
        <br>
        <label for="">나이</label>
        <input type="text" name=age id='age' value={{stu.age}}>
        <br>
        <label for="">성별</label>
        <input type="radio" name=gender id='man' value='남자' {%if '남자' in stu.gender%}checked{%endif%} >
        <label for="man">남자</label>
        <input type="radio" name=gender id='woman' value='여자' {%if '여자' in stu.gender%}checked{%endif%}>
        <label for="woman">여자</label>
        <br>
        <input type="submit" value='수정'>  
        <a href="/students/slist/"><button type='button'>취소</button></a>
        <br>


    </form>
</body>
</html>
