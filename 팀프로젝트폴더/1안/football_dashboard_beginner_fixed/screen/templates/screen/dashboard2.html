<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K League Data Lab</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#17201d}.top{background:#111a17;color:#fff;padding:20px 40px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:20px}.top a{color:#b9f34b;text-decoration:none}.page{max-width:1300px;margin:28px auto;padding:0 20px}.title h2{font-size:28px;margin-bottom:5px}.title p{color:#7c8782}.filters{background:white;padding:16px;border-radius:15px;margin:20px 0;box-shadow:0 5px 18px #0000000d}.filters select,.filters button{height:40px;border-radius:9px;border:1px solid #dde3e0;padding:0 13px;margin-right:7px}.filters button{background:#173d30;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.box{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 18px #0000000d}table{width:100%;border-collapse:collapse;margin-top:15px}th{font-size:11px;color:#718079;background:#f2f5f3}th,td{padding:13px;text-align:center;border-bottom:1px solid #edf0ee}tr.data:hover{background:#f4fae9;cursor:pointer}.rank{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0ee}.num{width:32px;height:32px;border-radius:9px;background:#eaf7d2;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#4d751d}.score{margin-left:auto;font-weight:bold}.prediction{background:#173d30;color:white;margin-top:18px}.prediction button{width:100%;height:43px;background:#b9f34b;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.bigscore{text-align:center;font-size:38px;font-weight:bold;margin:22px 0;color:#b9f34b}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="top"><h1>K LEAGUE · DATA LAB</h1><a href="/">← Tactical Dashboard</a></div><div class="page"><div class="title"><h2>Performance Data</h2><p>선수와 경기 데이터를 표 중심으로 확인하는 분석 화면</p></div><div class="filters"><select id="team"><option>전체 구단</option><option>전북 현대</option><option>FC 서울</option><option>울산 HD</option></select><select id="position"><option>전체 포지션</option><option>FW</option><option>MF</option><option>DF</option><option>GK</option></select><button onclick="searchBtn()">검색</button></div><div class="grid"><div class="box"><h3>PLAYER DATABASE</h3><table><tr><th>RANK</th><th>선수</th><th>POS</th><th>출전</th><th>득점</th><th>도움</th><th>평점</th></tr><tr class="data" onclick="pick('티아고',8.5)"><td>1</td><td>티아고</td><td>FW</td><td>14</td><td>8</td><td>2</td><td>8.5</td></tr><tr class="data" onclick="pick('송민규',8.4)"><td>2</td><td>송민규</td><td>MF</td><td>12</td><td>4</td><td>5</td><td>8.4</td></tr><tr class="data" onclick="pick('문선민',8.3)"><td>3</td><td>문선민</td><td>FW</td><td>11</td><td>5</td><td>3</td><td>8.3</td></tr><tr class="data" onclick="pick('박진섭',8.2)"><td>4</td><td>박진섭</td><td>DF</td><td>13</td><td>1</td><td>1</td><td>8.2</td></tr></table></div><div><div class="box"><h3>TOP PLAYERS</h3><div class="rank"><div class="num">1</div><div><b>티아고</b><br><small>FW</small></div><div class="score">8.5</div></div><div class="rank"><div class="num">2</div><div><b>송민규</b><br><small>MF</small></div><div class="score">8.4</div></div><div class="rank"><div class="num">3</div><div><b>문선민</b><br><small>FW</small></div><div class="score">8.3</div></div></div><div class="box prediction"><h3>MATCH PREDICTION</h3><p id="selected">선수 또는 팀 데이터를 선택하세요.</p><div class="bigscore" id="result">- : -</div><button onclick="predictBtn()">예측 실행</button></div></div></div></div><script>function searchBtn(){let t=document.getElementById('team').value;let p=document.getElementById('position').value;alert(t+' / '+p+' 검색');}function pick(name,score){document.getElementById('selected').innerText=name+' 선택 · 평점 '+score;}function predictBtn(){document.getElementById('result').innerText='2 : 1';}</script></body></html>
