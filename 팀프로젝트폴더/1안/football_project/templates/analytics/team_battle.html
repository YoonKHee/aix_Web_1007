<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>K리그 11 vs 11 맞대결 스쿼드 빌더</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .battle-pitch-container {
            background: linear-gradient(to right, #1b4d27, #2b7a3e, #1b4d27);
            border: 4px solid #ffffff;
            border-radius: 15px;
            min-height: 740px;
            position: relative;
            padding: 20px 10px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
            overflow-x: auto;
        }
        .pitch-center-line {
            position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(255,255,255,0.4);
        }
        .pitch-circle-mid {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%;
        }
        .player-chip {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 110px;
            margin: 0 auto;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .player-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0d6efd;
            margin-bottom: 3px;
        }
        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 8px;
        }
        .slot-control {
            font-size: 0.7rem;
            padding: 2px 4px;
            width: 110px;
            margin-top: 3px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-3 px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold m-0">⚔️ K리그 11 vs 11 맞대결 스쿼드 빌더</h2>
            <div>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-success fw-bold me-2">&larr; 베스트 11 전술 필드</a>
                <a href="{% url 'player_stats' %}" class="btn btn-outline-dark fw-bold">📊 전체 선수 점수표</a>
            </div>
        </div>

        <!-- 팀 선택 및 총점 -->
        <div class="card shadow-sm mb-3">
            <div class="card-body py-2">
                <form method="GET" class="row g-2 align-items-center justify-content-center">
                    <div class="col-md-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="fw-bold text-primary small">🔵 HOME 팀</label>
                            <span class="badge bg-primary fs-6" id="home-total-score">팀 총점: 0.0점</span>
                        </div>
                        <select name="team_a" class="form-select form-select-sm" onchange="this.form.submit()">
                            {% for t in teams_list %}
                                <option value="{{ t }}" {% if t == team_a %}selected{% endif %}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-1 text-center align-self-end">
                        <span class="fs-4 fw-bold text-danger">VS</span>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="fw-bold text-danger small">🔴 AWAY 팀</label>
                            <span class="badge bg-danger fs-6" id="away-total-score">팀 총점: 0.0점</span>
                        </div>
                        <select name="team_b" class="form-select form-select-sm" onchange="this.form.submit()">
                            {% for t in teams_list %}
                                <option value="{{ t }}" {% if t == team_b %}selected{% endif %}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </form>
            </div>
        </div>

        <!-- 가로 대형 필드 (11 vs 11) -->
        <div class="battle-pitch-container">
            <div class="pitch-center-line"></div>
            <div class="pitch-circle-mid"></div>

            <div class="d-flex justify-content-between align-items-center w-100 position-relative z-1" style="min-width: 1150px;">
                <!-- HOME 팀 11개 슬롯 배치 영역 -->
                <div class="d-flex justify-content-around align-items-center w-48" id="home-slots-container" style="width: 48%;"></div>
                <!-- AWAY 팀 11개 슬롯 배치 영역 -->
                <div class="d-flex justify-content-around align-items-center w-48" id="away-slots-container" style="width: 48%;"></div>
            </div>
        </div>
    </div>

    <script>
        const playersA = {{ players_a_json|safe }};
        const playersB = {{ players_b_json|safe }};

        // 초기 11개 슬롯 (처음엔 포지션별 기본값 지정, 사용자가 원하면 바꿀 수 있음)
        const defaultSlotsConfig = [
            { id: 's1', pos: 'GK' },
            { id: 's2', pos: 'DF' }, { id: 's3', pos: 'DF' }, { id: 's4', pos: 'DF' }, { id: 's5', pos: 'DF' },
            { id: 's6', pos: 'MF' }, { id: 's7', pos: 'MF' }, { id: 's8', pos: 'MF' },
            { id: 's9', pos: 'FW' }, { id: 's10', pos: 'FW' }, { id: 's11', pos: 'FW' }
        ];

        let stateA = defaultSlotsConfig.map(s => ({ ...s, selectedPlayer: '' }));
        let stateB = defaultSlotsConfig.map(s => ({ ...s, selectedPlayer: '' }));

        function getBadgeClass(pos) {
            if (pos === 'FW') return 'bg-danger';
            if (pos === 'MF') return 'bg-primary';
            if (pos === 'DF') return 'bg-success';
            return 'bg-dark';
        }

        function renderAll() {
            renderTeam('A', stateA, playersA);
            renderTeam('B', stateB, playersB);
            updateScores();
        }

        function renderTeam(teamType, stateList, playersData) {
            const containerId = teamType === 'A' ? 'home-slots-container' : 'away-slots-container';
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const usedPlayers = stateList.map(s => s.selectedPlayer).filter(Boolean);

            stateList.forEach((slot) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'slot-wrapper';

                const player = playersData.find(p => p.선수명 === slot.selectedPlayer);

                // 칩 카드 HTML
                let chipContent = '';
                if (player) {
                    chipContent = `
                        <img src="${player.이미지유형 || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="player-img">
                        <div class="badge ${getBadgeClass(slot.pos)} mb-1" style="font-size:0.65rem;">${slot.pos}</div>
                        <div class="fw-bold text-dark text-truncate w-100" style="font-size:0.7rem;">${player.선수명}</div>
                        <div class="text-primary fw-bold" style="font-size:0.75rem;">${parseFloat(player.종합_평가점수).toFixed(1)}점</div>
                    `;
                } else {
                    chipContent = `
                        <div class="text-muted small fw-bold mb-1" style="font-size:0.65rem;">[빈 자리]</div>
                        <div class="badge ${getBadgeClass(slot.pos)}" style="font-size:0.65rem;">${slot.pos}</div>
                        <div class="text-secondary mt-1" style="font-size:0.65rem;">선수 선택</div>
                    `;
                }

                // 해당 포지션에 맞는 선수 목록 필터링
                const matchedPlayers = playersData.filter(p => p.포지션.trim().toUpperCase() === slot.pos.trim().toUpperCase());
                
                let playerOptions = `<option value="">-- 선수 선택 --</option>`;
                matchedPlayers.forEach(p => {
                    if (!usedPlayers.includes(p.선수명) || p.선수명 === slot.selectedPlayer) {
                        const sel = (p.선수명 === slot.selectedPlayer) ? 'selected' : '';
                        playerOptions += `<option value="${p.선수명}" ${sel}>${p.선수명} (${parseFloat(p.종합_평가점수).toFixed(1)}점)</option>`;
                    }
                });

                wrapper.innerHTML = `
                    <div class="player-chip">${chipContent}</div>
                    <select class="form-select form-select-sm slot-control fw-bold" onchange="onPosChange('${teamType}', '${slot.id}', this.value)">
                        <option value="GK" ${slot.pos === 'GK' ? 'selected' : ''}>GK</option>
                        <option value="DF" ${slot.pos === 'DF' ? 'selected' : ''}>DF</option>
                        <option value="MF" ${slot.pos === 'MF' ? 'selected' : ''}>MF</option>
                        <option value="FW" ${slot.pos === 'FW' ? 'selected' : ''}>FW</option>
                    </select>
                    <select class="form-select form-select-sm slot-control" onchange="onPlayerChange('${teamType}', '${slot.id}', this.value)">
                        ${playerOptions}
                    </select>
                `;
                container.appendChild(wrapper);
            });
        }

        function onPosChange(teamType, slotId, newPos) {
            const stateList = teamType === 'A' ? stateA : stateB;
            const slot = stateList.find(s => s.id === slotId);
            if (slot) {
                slot.pos = newPos;
                slot.selectedPlayer = ''; // 포지션 바꾸면 선택 초기화
                renderAll();
            }
        }

        function onPlayerChange(teamType, slotId, playerName) {
            const stateList = teamType === 'A' ? stateA : stateB;
            const slot = stateList.find(s => s.id === slotId);
            if (slot) {
                slot.selectedPlayer = playerName;
                renderAll();
            }
        }

        function updateScores() {
            const sumA = stateA.reduce((acc, s) => {
                const p = playersA.find(item => item.선수명 === s.selectedPlayer);
                return acc + (p ? parseFloat(p.종합_평가점수 || 0) : 0);
            }, 0);

            const sumB = stateB.reduce((acc, s) => {
                const p = playersB.find(item => item.선수명 === s.selectedPlayer);
                return acc + (p ? parseFloat(p.종합_평가점수 || 0) : 0);
            }, 0);

            document.getElementById('home-total-score').innerText = `팀 총점: ${sumA.toFixed(1)}점`;
            document.getElementById('away-total-score').innerText = `팀 총점: ${sumB.toFixed(1)}점`;
        }

        document.addEventListener("DOMContentLoaded", function() {
            renderAll();
        });
    </script>
</body>
</html>
