<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>감독? 내가한다! - 축구 포메이션 & 라인업 빌더</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pitch: {
              light: '#2d8a4e',
              dark: '#1b5a32',
              line: '#ffffff',
              stripe: '#257843'
            },
            accent: {
              DEFAULT: '#f59e0b',
              hover: '#d97706'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (XLSX) CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap');
    
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
    }

    /* Custom Pitch Patterns */
    .pitch-bg {
      background-color: #247543;
      background-image: repeating-linear-gradient(
        0deg,
        #247543,
        #247543 40px,
        #1f663a 40px,
        #1f663a 80px
      );
    }

    .pitch-bg-horizontal {
      background-color: #247543;
      background-image: repeating-linear-gradient(
        90deg,
        #247543,
        #247543 40px,
        #1f663a 40px,
        #1f663a 80px
      );
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col transition-colors duration-200" onclick="closePlayerPopover(event)">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500 text-slate-950 p-2 rounded-xl font-black text-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-futbol"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-amber-400 bg-clip-text text-transparent">
            감독? 내가한다!
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">아마추어 & 동호회 축구 포메이션 빌더</p>
        </div>
      </div>

      <!-- Controls Header Bar -->
      <div class="flex items-center gap-2 flex-wrap text-sm">
        <!-- Formation Selector -->
        <div class="flex items-center gap-1.5 bg-slate-900/80 p-1.5 rounded-lg border border-slate-700">
          <i class="fa-solid fa-diagram-project text-amber-400 pl-1"></i>
          <label for="formationSelect" class="text-xs font-semibold text-slate-400 hidden md:inline">포메이션:</label>
          <select id="formationSelect" class="bg-transparent text-slate-100 font-bold focus:outline-none cursor-pointer text-xs sm:text-sm">
            <option value="4-3-3" class="bg-slate-800">4-3-3 (공격형)</option>
            <option value="4-2-3-1" class="bg-slate-800" selected>4-2-3-1 (더블 볼란테)</option>
            <option value="4-4-2" class="bg-slate-800">4-4-2 (플랫)</option>
            <option value="3-5-2" class="bg-slate-800">3-5-2 (윙백)</option>
            <option value="3-4-3" class="bg-slate-800">3-4-3 (스리톱)</option>
            <option value="4-1-4-1" class="bg-slate-800">4-1-4-1 (원볼란테)</option>
          </select>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700 gap-1">
          <button id="btnNavPitch" onclick="switchMainPage('pitch')" class="px-3 py-1.5 rounded-md text-xs font-bold bg-emerald-600 text-white transition">
            <i class="fa-solid fa-futbol mr-1"></i>축구장 피치
          </button>
          <button id="btnNavSquad" onclick="switchMainPage('squad')" class="px-3 py-1.5 rounded-md text-xs font-bold text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-users mr-1"></i>선수단 관리
          </button>
        </div>

        <!-- Orientation Toggle -->
        <button id="toggleOrientationBtn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5" title="피치 방향 전환">
          <i class="fa-solid fa-rotate"></i>
          <span class="hidden sm:inline" id="orientationLabel">세로 모드</span>
        </button>

        <!-- Excel Upload -->
        <button onclick="document.getElementById('excelInput').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md">
          <i class="fa-solid fa-file-excel"></i>
          <span class="hidden sm:inline">다중 파일 등록</span>
        </button>
        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv, image/*" multiple class="hidden">

        <!-- Data Reset / Sync Button -->
        <button onclick="refreshSquadData()" class="bg-indigo-600/60 hover:bg-indigo-500 text-indigo-100 px-3 py-2 rounded-lg text-xs font-semibold border border-indigo-500 transition flex items-center gap-1.5" title="선수단/사진 동기화">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span class="hidden sm:inline">선수 새로고침</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 flex-1 w-full">

    <!-- PAGE 1: 축구장 피치 전면 화면 -->
    <section id="sectionPitch" class="flex flex-col gap-3">
      
      <!-- Stats Summary Bar -->
      <div class="bg-slate-800/60 backdrop-blur rounded-xl p-3 border border-slate-700/60 flex items-center justify-between text-xs sm:text-sm">
        <div class="flex items-center gap-3">
          <span class="font-bold text-slate-300 flex items-center gap-1">
            <i class="fa-solid fa-users text-emerald-400"></i> 선발 등록:
            <strong id="selectedCount" class="text-amber-400 text-base">0</strong>/11 명
          </span>
          <span class="text-slate-500">|</span>
          <span class="font-bold text-slate-300">
            팀 평균: <strong id="teamAvgOverall" class="text-emerald-400 text-base">0</strong>점
          </span>
        </div>
        <div class="flex gap-2">
          <button onclick="clearLineup()" class="text-xs bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-2.5 py-1.5 rounded border border-rose-500/30 transition">
            <i class="fa-solid fa-trash-can mr-1"></i>초기화
          </button>
          <button onclick="autoFillSquad()" class="text-xs bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500/30 px-2.5 py-1.5 rounded border border-indigo-500/30 transition">
            <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>자동 추천
          </button>
        </div>
      </div>

      <!-- MAIN PITCH CONTAINER (화면 최대화) -->
      <div class="w-full bg-slate-950 rounded-2xl p-2 sm:p-4 border-2 border-slate-700/80 shadow-2xl overflow-hidden flex items-center justify-center min-h-[580px] sm:min-h-[720px] relative">
        <div id="pitchBoard" class="relative w-full h-[580px] sm:h-[700px] pitch-bg-horizontal rounded-xl border-2 border-white/70 shadow-inner overflow-hidden transition-all duration-300">
          
          <!-- Pitch Markings -->
          <div class="pitch-lines absolute inset-0 pointer-events-none">
            <div id="centerLine" class="absolute w-full h-0.5 bg-white/60 top-1/2 -translate-y-1/2"></div>
            <div class="absolute w-28 h-28 sm:w-44 sm:h-44 border-2 border-white/60 rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute w-2 h-2 bg-white/80 rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
            <div id="boxTop" class="absolute top-0 left-1/2 -translate-x-1/2 w-3/5 h-1/5 border-b-2 border-x-2 border-white/60"></div>
            <div id="goalAreaTop" class="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-[8%] border-b-2 border-x-2 border-white/60"></div>
            <div id="boxBottom" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-3/5 h-1/5 border-t-2 border-x-2 border-white/60"></div>
            <div id="goalAreaBottom" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1/3 h-[8%] border-t-2 border-x-2 border-white/60"></div>
          </div>

          <!-- SLOTS CONTAINER -->
          <div id="pitchSlots" class="absolute inset-0 z-10"></div>

          <!-- PLAYER STATS POPOVER CARD (선수 옆에 떠오르는 육각 그래프 창) -->
          <div id="playerPopover" onclick="event.stopPropagation()" class="absolute hidden z-30 bg-slate-900/95 border border-amber-400/80 rounded-xl p-3 shadow-2xl backdrop-blur-md w-56 flex flex-col items-center gap-2 transition-all duration-200">
            <div class="flex items-center justify-between w-full border-b border-slate-700 pb-1.5">
              <span id="popoverPlayerTitle" class="text-xs font-bold text-amber-400 truncate">선수 능력치</span>
              <button onclick="closePlayerPopoverDirect()" class="text-slate-400 hover:text-white text-xs">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
            
            <div class="w-full aspect-square relative flex items-center justify-center">
              <canvas id="teamRadarChart"></canvas>
            </div>

            <button id="btnPopoverAssign" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1 rounded text-xs transition">
              선수 교체/지정
            </button>
          </div>

        </div>
      </div>

    </section>

    <!-- PAGE 2: 선수단 관리 전용 페이지 -->
    <section id="sectionSquad" class="hidden flex flex-col gap-3">
      <!-- Search & Filter Controls -->
      <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" oninput="renderSquadList()" placeholder="선수 이름 검색..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
        </div>
        <select id="teamFilter" onchange="renderSquadList()" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          <option value="ALL">전체 팀</option>
          <option value="울산 HD">울산 HD</option>
          <option value="전북 현대">전북 현대</option>
          <option value="포항 스틸러스">포항 스틸러스</option>
          <option value="FC 서울">FC 서울</option>
          <option value="해외파">해외파</option>
        </select>
        <select id="positionFilter" onchange="renderSquadList()" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          <option value="ALL">전체 포지션</option>
          <option value="FW">FW (공격수)</option>
          <option value="MF">MF (미드필더)</option>
          <option value="DF">DF (수비수)</option>
          <option value="GK">GK (골키퍼)</option>
        </select>
        <button onclick="openAddPlayerModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center justify-center gap-1">
          <i class="fa-solid fa-user-plus"></i> 추가
        </button>
      </div>

      <!-- Squad Player Cards List -->
      <div id="squadListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5 max-h-[600px] overflow-y-auto pr-1"></div>
    </section>

  </main>

  <!-- MODAL: ASSIGN PLAYER TO SLOT -->
  <div id="slotAssignModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 shadow-2xl flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <div>
          <h3 class="text-base font-bold text-slate-100" id="assignModalTitle">포지션 선수 배치</h3>
          <p class="text-xs text-slate-400" id="assignModalSub">선택 포지션: FW</p>
        </div>
        <button onclick="closeAssignModal()" class="text-slate-400 hover:text-slate-200 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="currentSlotPlayerCard" class="hidden bg-slate-900 p-3 rounded-xl border border-slate-700 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="currentSlotAvatar" class="w-10 h-10 rounded-full bg-slate-700 font-bold flex items-center justify-center text-sm border-2 border-amber-400">
            -
          </div>
          <div>
            <div id="currentSlotName" class="font-bold text-sm">선수이름</div>
            <div id="currentSlotPos" class="text-xs text-slate-400">포지션</div>
          </div>
        </div>
        <button onclick="unassignCurrentSlot()" class="text-xs bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 border border-rose-500/40 px-3 py-1.5 rounded-lg transition font-semibold">
          선발 해제
        </button>
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-400">교체/배치할 선수 선택:</label>
        <div id="modalPlayerList" class="max-h-60 overflow-y-auto space-y-1.5 pr-1"></div>
      </div>

      <div class="flex justify-end pt-2 border-t border-slate-700">
        <button onclick="closeAssignModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold transition">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-800 border border-emerald-500 text-slate-100 px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 text-xs font-semibold pointer-events-none">
    <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
    <span id="toastMsg">알림 메시지</span>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // 기본 선수단 데이터 (프로필 이미지 SVG 보완)
    const DEFAULT_SQUAD = [
      { id: 1, name: '손흥민', pos: 'FW', number: 7, att: 92, pas: 82, def: 45, spd: 91, sta: 88, team: '토트넘 홋스퍼', avatar: 'https://images.unsplash.com/photo-1543351611-58f69d7c1781?w=150&auto=format&fit=crop&q=80' },
      { id: 2, name: '김민재', pos: 'DF', number: 3, att: 55, pas: 72, def: 91, spd: 86, sta: 90, team: '바이에른 뮌헨', avatar: '' },
      { id: 3, name: '이강인', pos: 'MF', number: 18, att: 84, pas: 90, def: 55, spd: 79, sta: 82, team: '파리 생제르맹', avatar: '' },
      { id: 4, name: '황희찬', pos: 'FW', number: 11, att: 85, pas: 74, def: 50, spd: 89, sta: 86, team: '울버햄튼', avatar: '' },
      { id: 5, name: '조규성', pos: 'FW', number: 9, att: 81, pas: 68, def: 48, spd: 78, sta: 84, team: '미트윌란', avatar: '' },
      { id: 6, name: '황인범', pos: 'MF', number: 6, att: 76, pas: 86, def: 74, spd: 76, sta: 91, team: '페예노르트', avatar: '' },
      { id: 7, name: '이재성', pos: 'MF', number: 10, att: 78, pas: 83, def: 68, spd: 77, sta: 92, team: '마인츠 05', avatar: '' },
      { id: 8, name: '설영우', pos: 'DF', number: 22, att: 72, pas: 75, def: 78, spd: 82, sta: 87, team: '즈베즈다', avatar: '' },
      { id: 9, name: '김영권', pos: 'DF', number: 19, att: 50, pas: 70, def: 83, spd: 68, sta: 76, team: '울산 HD', avatar: '' },
      { id: 10, name: '조현우', pos: 'GK', number: 21, att: 25, pas: 62, def: 86, spd: 60, sta: 75, team: '울산 HD', avatar: '' },
      { id: 11, name: '정우영', pos: 'MF', number: 5, att: 65, pas: 78, def: 81, spd: 72, sta: 85, team: '울산 HD', avatar: '' }
    ];

    let squad = [];
    let currentLineup = Array(11).fill(null);
    let currentFormation = '4-2-3-1';
    let isHorizontalPitch = false;
    let activeModalSlotIndex = null;
    let radarChartInstance = null;

    const FORMATIONS = {
      '4-3-3': [
        { slotId: 0, label: 'GK', posGroup: 'GK', x: 50, y: 90 },
        { slotId: 1, label: 'LB', posGroup: 'DF', x: 15, y: 72 },
        { slotId: 2, label: 'CB', posGroup: 'DF', x: 38, y: 76 },
        { slotId: 3, label: 'CB', posGroup: 'DF', x: 62, y: 76 },
        { slotId: 4, label: 'RB', posGroup: 'DF', x: 85, y: 72 },
        { slotId: 5, label: 'DM', posGroup: 'MF', x: 50, y: 56 },
        { slotId: 6, label: 'CM', posGroup: 'MF', x: 32, y: 42 },
        { slotId: 7, label: 'CM', posGroup: 'MF', x: 68, y: 42 },
        { slotId: 8, label: 'LW', posGroup: 'FW', x: 18, y: 18 },
        { slotId: 9, label: 'ST', posGroup: 'FW', x: 50, y: 14 },
        { slotId: 10, label: 'RW', posGroup: 'FW', x: 82, y: 18 }
      ],
      '4-2-3-1': [
        { slotId: 0, label: 'GK', posGroup: 'GK', x: 50, y: 90 },
        { slotId: 1, label: 'LB', posGroup: 'DF', x: 15, y: 73 },
        { slotId: 2, label: 'CB', posGroup: 'DF', x: 38, y: 77 },
        { slotId: 3, label: 'CB', posGroup: 'DF', x: 62, y: 77 },
        { slotId: 4, label: 'RB', posGroup: 'DF', x: 85, y: 73 },
        { slotId: 5, label: 'LDM', posGroup: 'MF', x: 35, y: 58 },
        { slotId: 6, label: 'RDM', posGroup: 'MF', x: 65, y: 58 },
        { slotId: 7, label: 'LAM', posGroup: 'MF', x: 20, y: 36 },
        { slotId: 8, label: 'CAM', posGroup: 'MF', x: 50, y: 34 },
        { slotId: 9, label: 'RAM', posGroup: 'MF', x: 80, y: 36 },
        { slotId: 10, label: 'ST', posGroup: 'FW', x: 50, y: 14 }
      ]
    };

    function saveDataToStorage() {
      try {
        localStorage.setItem('builder_squad_data', JSON.stringify(squad));
        localStorage.setItem('builder_lineup_data', JSON.stringify(currentLineup));
        localStorage.setItem('builder_formation', currentFormation);
      } catch (e) {
        console.warn('Storage Error', e);
      }
    }

    function loadDataFromStorage() {
      try {
        const savedSquad = localStorage.getItem('builder_squad_data');
        const savedLineup = localStorage.getItem('builder_lineup_data');
        const savedFormation = localStorage.getItem('builder_formation');

        if (savedSquad) squad = JSON.parse(savedSquad);
        else squad = JSON.parse(JSON.stringify(DEFAULT_SQUAD));

        if (savedLineup) currentLineup = JSON.parse(savedLineup);
        if (savedFormation && FORMATIONS[savedFormation]) currentFormation = savedFormation;
      } catch (e) {
        squad = JSON.parse(JSON.stringify(DEFAULT_SQUAD));
      }
    }

    function calcOverall(p) {
      if (!p) return 0;
      return Math.round((p.att + p.pas + p.def + p.spd + p.sta) / 5);
    }

    function getPosBadgeColor(pos) {
      switch(pos) {
        case 'FW': return 'bg-rose-500 text-white';
        case 'MF': return 'bg-amber-500 text-slate-950';
        case 'DF': return 'bg-blue-500 text-white';
        case 'GK': return 'bg-emerald-500 text-white';
        default: return 'bg-slate-600 text-white';
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    function renderPitch() {
      const slotsContainer = document.getElementById('pitchSlots');
      slotsContainer.innerHTML = '';

      const slots = FORMATIONS[currentFormation] || FORMATIONS['4-2-3-1'];

      slots.forEach((slot, index) => {
        const assignedPlayerId = currentLineup[index];
        const player = squad.find(p => p.id === assignedPlayerId);
        
        let leftPct = slot.x;
        let topPct = slot.y;

        if (isHorizontalPitch) {
          leftPct = slot.y;
          topPct = 100 - slot.x;
        }

        const slotEl = document.createElement('div');
        slotEl.className = 'absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer group transition-all duration-300';
        slotEl.style.left = `${leftPct}%`;
        slotEl.style.top = `${topPct}%`;
        
        slotEl.onclick = (e) => {
          e.stopPropagation();
          selectPitchPlayer(index, slotEl);
        };

        if (player) {
          const overall = calcOverall(player);
          const isPosMatched = player.pos === slot.posGroup;

          slotEl.innerHTML = `
            <div class="relative group">
              <div class="w-14 h-14 sm:w-20 sm:h-20 rounded-full border-2 ${isPosMatched ? 'border-amber-400' : 'border-rose-400'} bg-slate-900 shadow-2xl flex items-center justify-center overflow-hidden transition transform group-hover:scale-110">
                ${player.avatar 
                  ? `<img src="${player.avatar}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(player.name)}&background=0D8ABC&color=fff';">` 
                  : `<div class="flex flex-col items-center justify-center bg-slate-800 w-full h-full"><i class="fa-solid fa-user text-slate-400 text-lg sm:text-2xl"></i></div>`}
              </div>
              <div class="absolute -top-1 -right-1 bg-slate-950 text-amber-400 border border-amber-400/60 text-[10px] sm:text-xs font-black w-5 h-5 sm:w-6 sm:h-6 rounded-full flex items-center justify-center shadow">
                ${overall}
              </div>
              <div class="absolute -bottom-1 -left-1 ${getPosBadgeColor(player.pos)} text-[9px] sm:text-[10px] font-extrabold px-1.5 py-0.5 rounded-md shadow">
                ${slot.label}
              </div>
            </div>
            <div class="mt-1 bg-slate-950/90 text-white font-bold text-[10px] sm:text-xs px-2 py-0.5 rounded-full border border-slate-700/80 max-w-[90px] truncate text-center shadow">
              ${player.name}
            </div>
          `;
        } else {
          slotEl.innerHTML = `
            <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-full border-2 border-dashed border-white/50 bg-black/30 backdrop-blur-xs flex flex-col items-center justify-center text-white/80 transition group-hover:border-amber-400 group-hover:bg-amber-500/20 group-hover:scale-110">
              <span class="text-xs sm:text-sm font-black">${slot.label}</span>
              <i class="fa-solid fa-plus text-[10px] mt-0.5 text-amber-400"></i>
            </div>
          `;
        }

        slotsContainer.appendChild(slotEl);
      });

      updateStatsSummary();
      saveDataToStorage();
    }

    // 선수 클릭 시 카드 옆에 팝업 창 떠오르게 구현
    function selectPitchPlayer(slotIndex, element) {
      activeModalSlotIndex = slotIndex;
      const pId = currentLineup[slotIndex];
      const player = squad.find(p => p.id === pId);

      if (player) {
        updateRadarChart([player.att, player.pas, player.def, player.spd, player.sta], `${player.name} 스탯`);

        const popover = document.getElementById('playerPopover');
        document.getElementById('popoverPlayerTitle').innerText = `${player.name} (${player.pos})`;

        const btnAssign = document.getElementById('btnPopoverAssign');
        btnAssign.onclick = () => {
          closePlayerPopoverDirect();
          openAssignModal(slotIndex);
        };

        // 팝업 창을 클릭한 선수 위치 바로 옆에 배치
        const rect = element.getBoundingClientRect();
        const pitchRect = document.getElementById('pitchBoard').getBoundingClientRect();

        let leftPos = rect.right - pitchRect.left + 10;
        let topPos = rect.top - pitchRect.top;

        if (leftPos + 220 > pitchRect.width) {
          leftPos = rect.left - pitchRect.left - 230;
        }

        popover.style.left = `${Math.max(10, leftPos)}px`;
        popover.style.top = `${Math.max(10, topPos)}px`;
        popover.classList.remove('hidden');
      } else {
        openAssignModal(slotIndex);
      }
    }

    function closePlayerPopover(e) {
      const popover = document.getElementById('playerPopover');
      if (popover && !popover.contains(e.target)) {
        popover.classList.add('hidden');
      }
    }

    function closePlayerPopoverDirect() {
      document.getElementById('playerPopover').classList.add('hidden');
    }

    function initRadarChart() {
      const ctx = document.getElementById('teamRadarChart').getContext('2d');
      radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['공격', '패스', '수비', '속도', '체력'],
          datasets: [{
            data: [0, 0, 0, 0, 0],
            backgroundColor: 'rgba(16, 185, 129, 0.3)',
            borderColor: '#10b981',
            borderWidth: 2,
            pointBackgroundColor: '#f59e0b'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              angleLines: { color: 'rgba(255, 255, 255, 0.2)' },
              grid: { color: 'rgba(255, 255, 255, 0.2)' },
              pointLabels: { color: '#f8fafc', font: { size: 10, weight: 'bold' } },
              ticks: { display: false },
              suggestedMin: 30,
              suggestedMax: 100
            }
          }
        }
      });
    }

    function updateRadarChart(dataArr, labelName) {
      if (!radarChartInstance) return;
      radarChartInstance.data.datasets[0].label = labelName;
      radarChartInstance.data.datasets[0].data = dataArr;
      radarChartInstance.update();
    }

    function refreshSquadData() {
      if (confirm('기본 선수 데이터 및 프로필 이미지를 새로고침하시겠습니까?')) {
        squad = JSON.parse(JSON.stringify(DEFAULT_SQUAD));
        renderSquadList();
        renderPitch();
        saveDataToStorage();
        showToast('선수 데이터 및 프로필이 동기화되었습니다!');
      }
    }

    function switchMainPage(pageKey) {
      const pitchSec = document.getElementById('sectionPitch');
      const squadSec = document.getElementById('sectionSquad');
      if (pageKey === 'pitch') {
        pitchSec.classList.remove('hidden'); squadSec.classList.add('hidden');
      } else {
        pitchSec.classList.add('hidden'); squadSec.classList.remove('hidden');
        renderSquadList();
      }
    }

    function renderSquadList() {
      const container = document.getElementById('squadListContainer');
      container.innerHTML = '';
      squad.forEach(p => {
        const isSelected = currentLineup.includes(p.id);
        const card = document.createElement('div');
        card.className = `p-2.5 rounded-xl border flex items-center justify-between ${isSelected ? 'bg-slate-800 border-emerald-500' : 'bg-slate-800/40 border-slate-700'}`;
        card.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-full bg-slate-900 overflow-hidden flex items-center justify-center font-bold text-xs">
              ${p.avatar ? `<img src="${p.avatar}" class="w-full h-full object-cover">` : p.name.substring(0, 2)}
            </div>
            <div>
              <div class="font-bold text-xs text-slate-100">${p.name} (${p.pos})</div>
              <div class="text-[10px] text-slate-400">${p.team || '소속 미지정'}</div>
            </div>
          </div>
          <div class="text-xs font-black text-amber-400">${calcOverall(p)}</div>
        `;
        container.appendChild(card);
      });
    }

    function updateStatsSummary() {
      const selected = currentLineup.map(id => squad.find(p => p.id === id)).filter(Boolean);
      document.getElementById('selectedCount').innerText = selected.length;
      if (selected.length === 0) {
        document.getElementById('teamAvgOverall').innerText = 0;
        return;
      }
      const sum = selected.reduce((acc, cur) => acc + calcOverall(cur), 0);
      document.getElementById('teamAvgOverall').innerText = Math.round(sum / selected.length);
    }

    function openAssignModal(slotIndex) {
      activeModalSlotIndex = slotIndex;
      document.getElementById('slotAssignModal').classList.remove('hidden');
    }
    function closeAssignModal() {
      document.getElementById('slotAssignModal').classList.add('hidden');
    }

    window.onload = function() {
      initRadarChart();
      loadDataFromStorage();
      renderSquadList();
      renderPitch();
    };
  </script>
</body>
</html>
