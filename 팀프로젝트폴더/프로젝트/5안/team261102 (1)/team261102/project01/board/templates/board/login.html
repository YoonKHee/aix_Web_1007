{% extends 'board/base.html' %}
{% block title %}로그인{% endblock %}
{% block content %}
{% if request.GET.need %}
<script>alert('자유게시판은 로그인 후 이용할 수 있습니다.\n로그인하거나 회원가입을 해주세요.');</script>
<div class="notice">🔒 자유게시판은 <b>로그인한 회원만</b> 이용할 수 있습니다.</div>
{% endif %}
<form class="card form" method="post">{% csrf_token %}
  <h1 style="margin-top:0">로그인</h1>
  {% if form.errors %}<div class="notice" style="background:#fdecea;color:#7a1d14;border-color:#f5c2bd">아이디 또는 비밀번호가 올바르지 않습니다.</div>{% endif %}
  <div class="field"><label for="id_username">아이디</label>
    <input type="text" name="username" id="id_username" value="{{ form.username.value|default_if_none:'' }}" autofocus required autocomplete="username"></div>
  <div class="field"><label for="id_password">비밀번호</label>
    <input type="password" name="password" id="id_password" required autocomplete="current-password"></div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn" type="submit" style="width:100%">로그인</button>
  <div class="auth-sub">아직 회원이 아니신가요? <a href="{% url 'board:signup' %}">회원가입</a></div>
</form>
{% endblock %}
