<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SCREEN_WIDTH = 1280;
const SCREEN_HEIGHT = 720;

// 색상 상수
const COLOR_GRASS_1 = "#228B22";
const COLOR_GRASS_2 = "#289628";
const COLOR_LINE = "#F0F0F0";
const COLOR_HOME = "#0077CC";
const COLOR_AWAY = "#DC143C";
const COLOR_BALL = "#FFFFFF";
const COLOR_GOAL = "#F0F0F0";
const COLOR_NET = "#B4B4B4";
const COLOR_STADIUM = "#1E1E23";
const COLOR_PANEL = "#1A1D24";
const COLOR_BUTTON = "#2D323E";
const COLOR_BUTTON_HOVER = "#3B82F6";
const COLOR_BUTTON_ACTIVE = "#0284C7";

const SCALE = 9;
const METER_LENGTH = 105;
const METER_WIDTH = 68;
const PITCH_WIDTH = METER_LENGTH * SCALE;  // 945
const PITCH_HEIGHT = METER_WIDTH * SCALE; // 612
const PITCH_X = (SCREEN_WIDTH - PITCH_WIDTH) / 2; // 167
const PITCH_Y = 95;
const PITCH_CENTER_X = PITCH_X + PITCH_WIDTH / 2;
const PITCH_CENTER_Y = PITCH_Y + PITCH_HEIGHT / 2;

function getPositionActionRadius(name) {
    if (name.includes("GK")) return 130.0;
    if (name.includes("CB") || name.includes("LB") || name.includes("RB") || name.includes("WB")) return 190.0;
    if (name.includes("CM") || name.includes("DM") || name.includes("AM") || name.includes("LM") || name.includes("RM")) return 320.0;
    if (name.includes("ST") || name.includes("LW") || name.includes("RW")) return 260.0;
    return 220.0;
}

function playSound(type) {
    const statusEl = document.getElementById('quickStatus');
    if (type === "whistle" && statusEl) statusEl.innerText = "🔊 [Sound] 휘슬 울림!";
    else if (type === "goal" && statusEl) statusEl.innerText = "⚽ GOAL!!!! 환호 소리!";
    else if (type === "foul" && statusEl) statusEl.innerText = "🚨 파울 휘슬!";
}

class Particle {
    constructor(x, y) {
        this.x = x; this.y = y;
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 50;
        this.radius = Math.floor(Math.random() * 4) + 3;
        const colors = ["#FFD700", "#FF4500", "#00FFFF", "#FF1493", "#32CD32", "#FFFFFF"];
        this.color = colors[Math.floor(Math.random() * colors.length)];
    }
    update() { this.x += this.vx; this.y += this.vy; this.vy += 0.15; this.life -= 1; }
    draw(context) {
        if (this.life > 0) {
            context.fillStyle = this.color;
            context.beginPath(); context.arc(this.x, this.y, this.radius, 0, Math.PI * 2); context.fill();
        }
    }
}

class Pitch {
    constructor() {
        this.width = PITCH_WIDTH; this.height = PITCH_HEIGHT;
        this.x = PITCH_X; this.y = PITCH_Y;
        this.center_x = PITCH_CENTER_X; this.center_y = PITCH_CENTER_Y;
        let goal_w = 7.32 * SCALE; let goal_depth = 2.5 * SCALE;
        this.leftGoal = { x: this.x - goal_depth, y: this.center_y - goal_w / 2, width: goal_depth, height: goal_w };
        this.rightGoal = { x: this.x + this.width, y: this.center_y - goal_w / 2, width: goal_depth, height: goal_w };
    }
    draw(context) {
        context.fillStyle = COLOR_STADIUM; context.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        let num_stripes = 13; let stripe_width = this.width / num_stripes;
        for (let i = 0; i < num_stripes; i++) {
            context.fillStyle = (i % 2 === 0) ? COLOR_GRASS_1 : COLOR_GRASS_2;
            context.fillRect(this.x + i * stripe_width, this.y, stripe_width, this.height);
        }
        context.strokeStyle = COLOR_LINE; context.lineWidth = 3; context.strokeRect(this.x, this.y, this.width, this.height);
        context.beginPath(); context.moveTo(this.center_x, this.y); context.lineTo(this.center_x, this.y + this.height); context.stroke();
        let center_circle_r = 9.15 * SCALE;
        context.beginPath(); context.arc(this.center_x, this.center_y, center_circle_r, 0, Math.PI * 2); context.stroke();
        context.beginPath(); context.arc(this.center_x, this.center_y, 4, 0, Math.PI * 2); context.fillStyle = COLOR_LINE; context.fill();
        let box_depth = 16.5 * SCALE; let box_width = 40.32 * SCALE;
        context.strokeRect(this.x, this.center_y - box_width / 2, box_depth, box_width);
        context.strokeRect(this.x + this.width - box_depth, this.center_y - box_width / 2, box_depth, box_width);
        this._drawGoalNet(context, this.leftGoal);
        this._drawGoalNet(context, this.rightGoal);
    }
    _drawGoalNet(context, goal) {
        context.strokeStyle = COLOR_GOAL; context.lineWidth = 3; context.strokeRect(goal.x, goal.y, goal.width, goal.height);
        context.strokeStyle = COLOR_NET; context.lineWidth = 1; let step = 8;
        for (let gx = goal.x + step; gx < goal.x + goal.width; gx += step) {
            context.beginPath(); context.moveTo(gx, goal.y); context.lineTo(gx, goal.y + goal.height); context.stroke();
        }
        for (let gy = goal.y + step; gy < goal.y + goal.height; gy += step) {
            context.beginPath(); context.moveTo(goal.x, gy); context.lineTo(goal.x + goal.width, gy); context.stroke();
        }
    }
}

class BallPhysics {
    constructor(x, y) {
        this.x = x; this.y = y; this.z = 0.0; this.vz = 0.0; this.vx = 0.0; this.vy = 0.0;
        this.possessor = null; this.kickType = "GROUND";
    }
    applyKick(vx, vy, vz, kickType = "GROUND") {
        this.vx = vx; this.vy = vy; this.vz = vz; this.kickType = kickType; this.possessor = null;
    }
    update(speedMultiplier) {
        if (this.possessor) {
            this.x = this.possessor.x + (this.possessor.team === 'home' ? 12 : -12);
            this.y = this.possessor.y; this.z = 0.0; this.vx = 0.0; this.vy = 0.0; this.vz = 0.0;
        } else {
            this.x += this.vx * speedMultiplier; this.y += this.vy * speedMultiplier; this.z += this.vz * speedMultiplier;
            if (this.z > 0) { this.vz -= 0.35 * speedMultiplier; }
            else { this.z = 0.0; if (this.vz < 0) this.vz = -this.vz * 0.3; }
            let friction = (this.kickType === "PASS") ? Math.pow(0.975, speedMultiplier) : Math.pow(0.96, speedMultiplier);
            this.vx *= friction; this.vy *= friction;
            if (this.x < PITCH_X || this.x > PITCH_X + PITCH_WIDTH) { this.vx *= -0.6; playSound("foul"); }
            if (this.y < PITCH_Y || this.y > PITCH_Y + PITCH_HEIGHT) { this.vy *= -0.6; }
        }
    }
    resetToCenter() {
        this.x = PITCH_CENTER_X; this.y = PITCH_CENTER_Y; this.z = 0.0; this.vx = 0.0; this.vy = 0.0; this.vz = 0.0; this.possessor = null;
    }
    draw(context) {
        let shadowScale = Math.max(3, Math.floor(12 - this.z * 0.15));
        context.fillStyle = "rgba(0, 0, 0, 0.3)";
        context.beginPath(); context.ellipse(this.x, this.y + 6, shadowScale, shadowScale / 2, 0, 0, Math.PI * 2); context.fill();
        let renderY = this.y - this.z;
        context.fillStyle = "#1E1E1E"; context.beginPath(); context.arc(this.x, renderY, 7, 0, Math.PI * 2); context.fill();
        context.fillStyle = COLOR_BALL; context.beginPath(); context.arc(this.x, renderY, 5, 0, Math.PI * 2); context.fill();
    }
}

class Player {
    constructor(x, y, team, name, speed = 2.2, passing = 70, shooting = 70) {
        this.original_base_x = x; this.original_base_y = y;
        this.x = x; this.y = y; this.vx = 0.0; this.vy = 0.0;
        this.team = team; this.name = name;
        this.stat_speed = speed; this.stat_passing = passing; this.stat_shooting = shooting;
        this.stamina = 100.0; this.goals = 0; this.passes_completed = 0; this.interceptions = 0;
    }
    calculateIntelligentTarget(ball, tactic, team, phase, opponents, teammates) {
        if (ball.possessor === null && ball.z > 2.0) {
            let timeToLand = ball.z / Math.max(0.1, Math.abs(ball.vz));
            return {
                x: Math.max(PITCH_X + 20, Math.min(PITCH_X + PITCH_WIDTH - 20, ball.x + ball.vx * timeToLand)),
                y: Math.max(PITCH_Y + 20, Math.min(PITCH_Y + PITCH_HEIGHT - 20, ball.y + ball.vy * timeToLand))
            };
        }
        return PositionBehaviorManager.getPositionTarget(this, ball, team, tactic, phase, opponents, teammates);
    }
    moveTowards(targetX, targetY, speedMultiplier, tactic) {
        let dx = targetX - this.x; let dy = targetY - this.y; let dist = Math.hypot(dx, dy);
        let drain = (tactic === "GEGENPRESSING") ? 0.009 : 0.005;
        this.stamina = Math.max(0.0, this.stamina - drain * speedMultiplier);
        let maxSpeed = this.stat_speed * speedMultiplier * (this.stamina < 30 ? 0.55 : 1.0);
        if (dist > 1.0) {
            this.vx += ((dx / dist) * maxSpeed - this.vx) * 0.12;
            this.vy += ((dy / dist) * maxSpeed - this.vy) * 0.12;
        } else { this.vx *= 0.8; this.vy *= 0.8; }
        this.x = Math.max(PITCH_X + 12, Math.min(PITCH_X + PITCH_WIDTH - 12, this.x + this.vx));
        this.y = Math.max(PITCH_Y + 12, Math.min(PITCH_Y + PITCH_HEIGHT - 12, this.y + this.vy));
    }
    draw(context, hasBall) {
        context.fillStyle = "rgba(0,0,0,0.35)"; context.beginPath(); context.ellipse(this.x, this.y + 3, 9, 4.5, 0, 0, Math.PI * 2); context.fill();
        context.fillStyle = hasBall ? "#FF8C00" : (this.team === 'home' ? COLOR_HOME : COLOR_AWAY);
        context.strokeStyle = "#141414"; context.lineWidth = 2;
        context.beginPath(); context.arc(this.x, this.y, hasBall ? 11 : 9, 0, Math.PI * 2); context.stroke(); context.fill();
        context.fillStyle = "#323232"; context.fillRect(this.x - 10, this.y - 28, 20, 3);
        context.fillStyle = this.stamina > 40 ? "#00FF00" : "#FF6400"; context.fillRect(this.x - 10, this.y - 28, 20 * (this.stamina / 100.0), 3);
        context.fillStyle = "#FFFFFF"; context.font = "11px 'Pretendard', sans-serif"; context.fillText(this.name, this.x - 14, this.y - 18);
    }
}

class PositionBehaviorManager {
    static getPositionTarget(player, ball, team, tactic, phase, opponents, teammates) {
        let base_x = player.original_base_x; let base_y = player.original_base_y;
        let dir_sign = team.isHome ? 1 : -1;
        let action_rad = getPositionActionRadius(player.name);

        if (player.name.includes("GK")) {
            return { x: base_x, y: Math.max(PITCH_CENTER_Y - 50, Math.min(PITCH_CENTER_Y + 50, ball.y)) };
        }
        // 볼 소유자가 없는 경우 본인 활동 반경 내 진입 시에만 공을 쫓아감
        if (ball.possessor === null && ball.z <= 2.0 && Math.hypot(ball.x - player.x, ball.y - player.y) <= action_rad) {
            return { x: ball.x, y: ball.y };
        }

        let team_cog_x = teammates && teammates.length > 0 ? teammates.reduce((s, t) => s + t.x, 0) / teammates.length : PITCH_CENTER_X;
        let dynamic_base_x = base_x + (ball.x - PITCH_CENTER_X) * 0.35 * dir_sign;

        if (player.name.includes("CB") || player.name.includes("LB") || player.name.includes("RB") || player.name.includes("WB")) {
            return { x: dynamic_base_x * 0.75 + team_cog_x * 0.25, y: base_y };
        }
        if (player.name.includes("CM") || player.name.includes("DM") || player.name.includes("AM") || player.name.includes("LM") || player.name.includes("RM")) {
            let shift_y = (ball.y - PITCH_CENTER_Y) * 0.25;
            return { x: dynamic_base_x * 0.85 + team_cog_x * 0.15, y: base_y + shift_y };
        }
        if (player.name.includes("ST") || player.name.includes("LW") || player.name.includes("RW")) {
            return { x: dynamic_base_x + (dir_sign * (phase === "FINAL_ATTACK" ? 70 : 35)), y: base_y + (ball.y - PITCH_CENTER_Y) * 0.15 };
        }
        return { x: dynamic_base_x, y: base_y };
    }
}

class DecisionEngine {
    static selectPassReceiver(passer, teammates, opponents) {
        if (!teammates || teammates.length === 0) return null;
        let action_rad = getPositionActionRadius(passer.name);
        let valid = teammates.filter(p => Math.hypot(p.x - passer.x, p.y - passer.y) <= action_rad);
        let pool = valid.length > 0 ? valid : teammates;
        return pool.reduce((prev, curr) => Math.hypot(curr.x - passer.x, curr.y - passer.y) < Math.hypot(prev.x - passer.x, prev.y - passer.y) ? curr : prev);
    }
    static evaluateShot(passer, distToGoal) {
        return distToGoal < 480 && Math.random() < (0.45 + passer.stat_shooting / 240.0);
    }
}

class Team {
    constructor(isHome = true, formation = "4-4-2", tactic = "TIKI_TAKA") {
        this.isHome = isHome; this.formation = formation; this.tactic = tactic;
        let px = isHome ? PITCH_X : PITCH_X + PITCH_WIDTH;
        let dirSign = isHome ? 1 : -1;
        let teamStr = isHome ? 'home' : 'away';
        let prefix = isHome ? 'H' : 'A';
        this.starters = this._createStarters(px, dirSign, teamStr, prefix, formation);
        this.bench = [
            new Player(px, PITCH_CENTER_Y, teamStr, `${prefix}-SUB1`, 2.3, 75, 70),
            new Player(px, PITCH_CENTER_Y, teamStr, `${prefix}-SUB2`, 2.2, 72, 72),
            new Player(px, PITCH_CENTER_Y, teamStr, `${prefix}-SUB3`, 2.4, 70, 75),
        ];
        this.subsLeft = 3;
    }
    _createStarters(px, dirSign, teamStr, prefix, formation) {
        let gk = new Player(px + dirSign * 35, PITCH_CENTER_Y, teamStr, `${prefix}-GK`, 1.8, 60, 30);
        return [
            gk,
            new Player(px + dirSign * 110, PITCH_CENTER_Y - 190, teamStr, `${prefix}-LB`, 2.3, 72, 45),
            new Player(px + dirSign * 90, PITCH_CENTER_Y - 65, teamStr, `${prefix}-CB1`, 2.0, 68, 40),
            new Player(px + dirSign * 90, PITCH_CENTER_Y + 65, teamStr, `${prefix}-CB2`, 2.0, 68, 40),
            new Player(px + dirSign * 110, PITCH_CENTER_Y + 190, teamStr, `${prefix}-RB`, 2.3, 72, 45),
            new Player(px + dirSign * 240, PITCH_CENTER_Y - 210, teamStr, `${prefix}-LM`, 2.4, 78, 65),
            new Player(px + dirSign * 220, PITCH_CENTER_Y - 70, teamStr, `${prefix}-CM1`, 2.1, 85, 60),
            new Player(px + dirSign * 220, PITCH_CENTER_Y + 70, teamStr, `${prefix}-CM2`, 2.1, 85, 60),
            new Player(px + dirSign * 240, PITCH_CENTER_Y + 210, teamStr, `${prefix}-RM`, 2.4, 78, 65),
            new Player(px + dirSign * 380, PITCH_CENTER_Y - 50, teamStr, `${prefix}-ST1`, 2.3, 70, 88),
            new Player(px + dirSign * 380, PITCH_CENTER_Y + 50, teamStr, `${prefix}-ST2`, 2.3, 70, 88),
        ];
    }
}

let mousePos = { x: 0, y: 0 };

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener('click', () => {
    if (gameState === "MENU") {
        homeFormButtons.forEach(btn => {
            if (isInside(mousePos, btn.rect)) {
                homeTeam = new Team(true, btn.name, homeTeam.tactic);
                allPlayers = [...homeTeam.starters, ...awayTeam.starters];
                gameStatusText = `홈 팀 포메이션 변경: [${btn.name}]`;
            }
        });
        homeTacticButtons.forEach(btn => {
            if (isInside(mousePos, btn.rect)) {
                homeTeam.tactic = btn.code;
                gameStatusText = `홈 팀 전술 변경: [${btn.label}]`;
            }
        });
        awayFormButtons.forEach(btn => {
            if (isInside(mousePos, btn.rect)) {
                awayTeam = new Team(false, btn.name, awayTeam.tactic);
                allPlayers = [...homeTeam.starters, ...awayTeam.starters];
                gameStatusText = `원정 팀 포메이션 변경: [${btn.name}]`;
            }
        });
        awayTacticButtons.forEach(btn => {
            if (isInside(mousePos, btn.rect)) {
                awayTeam.tactic = btn.code;
                gameStatusText = `원정 팀 전술 변경: [${btn.label}]`;
            }
        });
        if (isInside(mousePos, btnStartMatch)) {
            gameState = "MATCH";
            playSound("whistle");
            ball.x = PITCH_CENTER_X; ball.y = PITCH_CENTER_Y;
            ball.possessor = homeTeam.starters[homeTeam.starters.length - 1];
            gameStatusText = "⚽ 킥오프! 포지션 구역 분리 가동.";
        }
        if (isInside(mousePos, btnOpenLocker)) {
            gameState = "LOCKER_ROOM";
        }
    } else if (gameState === "MATCH") {
        if (isInside(mousePos, btnMatchPause)) isPaused = !isPaused;
        else if (isInside(mousePos, btnSpeedDown) && speedIdx > 0) speedIdx--;
        else if (isInside(mousePos, btnSpeedUp) && speedIdx < speedLevels.length - 1) speedIdx++;
        else if (isInside(mousePos, btnMatchLocker)) gameState = "LOCKER_ROOM";
        else if (isInside(mousePos, btnMatchSub)) executePlayerSub();
    } else if (gameState === "LOCKER_ROOM") {
        if (isInside(mousePos, btnCloseLocker)) gameState = (matchTime > 0) ? "MATCH" : "MENU";
    } else if (gameState === "SUMMARY") {
        if (isInside(mousePos, btnRestart)) {
            pitch = new Pitch();
            ball = new BallPhysics(PITCH_CENTER_X, PITCH_CENTER_Y);
            homeTeam = new Team(true, "4-4-2", "TIKI_TAKA");
            awayTeam = new Team(false, "4-4-2", "TIKI_TAKA");
            allPlayers = [...homeTeam.starters, ...awayTeam.starters];
            particles = []; matchTime = 0.0; homeScore = 0; awayScore = 0;
            isPaused = false; gameState = "MENU";
            gameStatusText = "전술판 대기 중 - 원하는 설정을 선택하세요.";
        }
    }
});

function isInside(pos, rect) {
    let w = rect.w || rect.width; let h = rect.h || rect.height;
    return pos.x >= rect.x && pos.x <= rect.x + w && pos.y >= rect.y && pos.y <= rect.y + h;
}

function executePlayerSub() {
    if (homeTeam.subsLeft > 0 && homeTeam.bench.length > 0) {
        let fieldPlayers = homeTeam.starters.filter(p => !p.name.includes("GK"));
        if (fieldPlayers.length > 0) {
            let tiredPlayer = fieldPlayers.reduce((prev, curr) => curr.stamina < prev.stamina ? curr : prev);
            let subPlayer = homeTeam.bench.shift();
            subPlayer.x = tiredPlayer.x; subPlayer.y = tiredPlayer.y;
            subPlayer.original_base_x = tiredPlayer.original_base_x;
            subPlayer.original_base_y = tiredPlayer.original_base_y;
            let idx = homeTeam.starters.indexOf(tiredPlayer);
            homeTeam.starters[idx] = subPlayer;
            allPlayers = [...homeTeam.starters, ...awayTeam.starters];
            homeTeam.subsLeft--;
            gameStatusText = `🔄 감독 선수 교체: [${tiredPlayer.name}] OUT -> [${subPlayer.name}] IN`;
        }
    } else {
        gameStatusText = "❌ 교체 불가 (잔여 횟수 소진)";
    }
}

// ==========================================
// 🔁 메인 루프
// ==========================================

function gameLoop() {
    let currentSpeed = speedLevels[speedIdx];

    if (gameState === "MATCH" && !isPaused) {
        matchTime += (1.0 / 60.0) * currentSpeed;

        if (matchTime >= matchDuration) {
            gameState = "SUMMARY";
            playSound("whistle");
        }

        // 1. 득점 판정
        if (ball.x >= pitch.rightGoal.x && ball.y >= pitch.rightGoal.y && ball.y <= pitch.rightGoal.y + pitch.rightGoal.height) {
            homeScore++; if (ball.possessor) ball.possessor.goals++;
            playSound("goal");
            for (let i = 0; i < 60; i++) particles.push(new Particle(ball.x, ball.y));
            gameStatusText = `⚽ GOAL! 홈 팀 득점! (${homeScore} : ${awayScore})`;
            ball.resetToCenter(); ball.possessor = homeTeam.starters[homeTeam.starters.length - 1];
        } else if (ball.x <= pitch.leftGoal.x + pitch.leftGoal.width && ball.y >= pitch.leftGoal.y && ball.y <= pitch.leftGoal.y + pitch.leftGoal.height) {
            awayScore++; if (ball.possessor) ball.possessor.goals++;
            playSound("goal");
            for (let i = 0; i < 60; i++) particles.push(new Particle(ball.x, ball.y));
            gameStatusText = `⚽ GOAL! 원정 팀 득점! (${homeScore} : ${awayScore})`;
            ball.resetToCenter(); ball.possessor = awayTeam.starters[awayTeam.starters.length - 1];
        }

        // 2. 볼 소유자 처리
        if (ball.possessor) {
            let passer = ball.possessor;
            let targetGoalX = (passer.team === 'home') ? PITCH_X + PITCH_WIDTH : PITCH_X;
            passer.x += (passer.team === 'home' ? 1.8 : -1.8) * currentSpeed;

            if (Math.floor(matchTime * 60) % Math.floor(Math.max(10, 60 / currentSpeed)) === 0) {
                if (DecisionEngine.evaluateShot(passer, Math.abs(passer.x - targetGoalX))) {
                    let dx = targetGoalX - passer.x; let dy = PITCH_CENTER_Y - passer.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > 0) ball.applyKick((dx / dist) * 8.5, (dy / dist) * 8.5, 3.0, "SHOT");
                    gameStatusText = `🔥 [${passer.name}] 강력한 슈팅 발사!`;
                } else {
                    let teammates = (passer.team === 'home' ? homeTeam : awayTeam).starters.filter(p => p !== passer);
                    let opponents = (passer.team === 'home') ? awayTeam.starters : homeTeam.starters;
                    let receiver = DecisionEngine.selectPassReceiver(passer, teammates, opponents);
                    if (receiver) {
                        let dx = receiver.x - passer.x; let dy = receiver.y - passer.y; let dist = Math.hypot(dx, dy);
                        if (dist > 0) ball.applyKick((dx / dist) * 5.5, (dy / dist) * 5.5, 2.0, "PASS");
                        passer.passes_completed++;
                        gameStatusText = `[${passer.name}] -> [${receiver.name}] 지능형 포지션 패스!`;
                    }
                }
            }
        }

        // 3. 오프더볼 파라미터 매치 완벽 수정 (진형 유지)
        allPlayers.forEach(p => {
            if (ball.possessor === p) return;
            let currentTeam = (p.team === 'home') ? homeTeam : awayTeam;
            let opponents = (p.team === 'home') ? awayTeam.starters : homeTeam.starters;
            let phase = (Math.abs(ball.x - (p.team === 'home' ? PITCH_X + PITCH_WIDTH : PITCH_X)) > 600) ? "BUILD_UP" : "FINAL_ATTACK";

            let target = p.calculateIntelligentTarget(ball, currentTeam.tactic, currentTeam, phase, opponents, currentTeam.starters);
            p.moveTowards(target.x, target.y, currentSpeed, currentTeam.tactic);
        });

        ball.update(currentSpeed);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // UI 렌더링
    if (gameState === "MENU") {
        ctx.fillStyle = "#121318"; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 24px 'Pretendard', sans-serif";
        ctx.fillText("⚽ 축구 매니저 시뮬레이터 (마우스 전용버전)", SCREEN_WIDTH / 2 - 220, 45);

        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(40, 70, 580, 550); ctx.fillRect(660, 70, 580, 550);

        ctx.fillStyle = COLOR_HOME; ctx.font = "bold 16px 'Pretendard', sans-serif";
        ctx.fillText(`🏠 홈 팀 선발 명단 (${homeTeam.formation})`, 60, 95);
        ctx.fillStyle = "#E0E0E0"; ctx.font = "13px 'Pretendard', sans-serif";
        homeTeam.starters.forEach((p, idx) => ctx.fillText(`[${p.name}] 속도:${p.stat_speed} 패스:${p.stat_passing} 슛:${p.stat_shooting}`, 60, 125 + idx * 25));

        ctx.fillStyle = COLOR_AWAY; ctx.font = "bold 16px 'Pretendard', sans-serif";
        ctx.fillText(`✈️ 원정 팀 선발 명단 (${awayTeam.formation})`, 680, 95);
        ctx.fillStyle = "#E0E0E0"; ctx.font = "13px 'Pretendard', sans-serif";
        awayTeam.starters.forEach((p, idx) => ctx.fillText(`[${p.name}] 속도:${p.stat_speed} 패스:${p.stat_passing} 슛:${p.stat_shooting}`, 680, 125 + idx * 25));

        ctx.fillStyle = "#FFFFFF"; ctx.fillText("포메이션 선택:", 60, 475);
        homeFormButtons.forEach(btn => drawBtn(btn.rect, btn.name, homeTeam.formation === btn.name));
        ctx.fillText("전술 성향 선택:", 60, 545);
        homeTacticButtons.forEach(btn => drawBtn(btn.rect, btn.label, homeTeam.tactic === btn.code));

        ctx.fillText("포메이션 선택:", 680, 475);
        awayFormButtons.forEach(btn => drawBtn(btn.rect, btn.name, awayTeam.formation === btn.name));
        ctx.fillText("전술 성향 선택:", 680, 545);
        awayTacticButtons.forEach(btn => drawBtn(btn.rect, btn.label, awayTeam.tactic === btn.code));

        drawActionBtn(btnStartMatch, "#059669");
        drawActionBtn(btnOpenLocker, "#2563EB");

    } else if (gameState === "LOCKER_ROOM") {
        ctx.fillStyle = "#121318"; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = "#FFD700"; ctx.font = "bold 22px 'Pretendard', sans-serif";
        ctx.fillText("🚪 라커룸 및 선수 실시간 통계 체크보드", SCREEN_WIDTH / 2 - 210, 40);

        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(40, 70, 580, 580); ctx.fillRect(660, 70, 580, 580);

        ctx.fillStyle = COLOR_HOME; ctx.font = "bold 16px 'Pretendard', sans-serif"; ctx.fillText("🏠 홈 팀 실시간 스탯", 60, 95);
        ctx.fillStyle = "#9CA3AF"; ctx.font = "12px 'Pretendard', sans-serif";
        ctx.fillText("이름        상태   체력     패스  슛  골  성공패스  인터셉트", 60, 120);

        ctx.fillStyle = "#F3F4F6";
        homeTeam.starters.forEach((p, idx) => {
            let line = `${p.name.padEnd(8)}  주전   ${p.stamina.toFixed(1)}%    ${p.stat_passing}   ${p.stat_shooting}   ${p.goals}골   ${p.passes_completed}회     ${p.interceptions}회`;
            ctx.fillText(line, 60, 145 + idx * 24);
        });

        ctx.fillStyle = COLOR_AWAY; ctx.font = "bold 16px 'Pretendard', sans-serif"; ctx.fillText("✈️ 원정 팀 실시간 스탯", 680, 95);
        ctx.fillStyle = "#9CA3AF"; ctx.font = "12px 'Pretendard', sans-serif";
        ctx.fillText("이름        상태   체력     패스  슛  골  성공패스  인터셉트", 680, 120);

        ctx.fillStyle = "#F3F4F6";
        awayTeam.starters.forEach((p, idx) => {
            let line = `${p.name.padEnd(8)}  주전   ${p.stamina.toFixed(1)}%    ${p.stat_passing}   ${p.stat_shooting}   ${p.goals}골   ${p.passes_completed}회     ${p.interceptions}회`;
            ctx.fillText(line, 680, 145 + idx * 24);
        });

        drawActionBtn(btnCloseLocker, "#4B5563");

    } else if (gameState === "SUMMARY") {
        ctx.fillStyle = "#0D0E12"; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = "#FFD700"; ctx.font = "bold 26px 'Pretendard', sans-serif";
        ctx.fillText("🏁 경기 종료 (FULL TIME)", SCREEN_WIDTH / 2 - 140, 100);

        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(340, 160, 600, 380);
        ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 36px 'Pretendard', sans-serif";
        ctx.fillText(`HOME  ${homeScore}  :  ${awayScore}  AWAY`, SCREEN_WIDTH / 2 - 160, 240);

        drawActionBtn(btnRestart, "#2563EB");

    } else {
        pitch.draw(ctx);
        let renderList = [...allPlayers, ball];
        renderList.sort((a, b) => a.y - b.y);
        renderList.forEach(obj => {
            if (obj instanceof BallPhysics) obj.draw(ctx);
            else obj.draw(ctx, ball.possessor === obj);
        });
        particles.forEach(p => p.draw(ctx));

        ctx.fillStyle = "rgba(15, 15, 20, 0.95)"; ctx.fillRect(0, 0, SCREEN_WIDTH, 85);
        ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 22px 'Pretendard', sans-serif";
        ctx.fillText(`HOME  ${homeScore} : ${awayScore}  AWAY`, SCREEN_WIDTH / 2 - 110, 32);

        ctx.font = "13px 'Pretendard', sans-serif"; ctx.fillStyle = "#9CA3AF";
        ctx.fillText(`시간: ${Math.floor(matchTime)}/${Math.floor(matchDuration)}초`, 40, 25);
        ctx.fillText(`배속: ${currentSpeed.toFixed(1)}x`, 40, 50);

        drawActionBtn({ x: btnMatchPause.x, y: btnMatchPause.y, w: btnMatchPause.w, h: btnMatchPause.h, label: isPaused ? "▶️ 재개" : "⏸️ 정지" }, isPaused ? "#059669" : "#DC2626");
        drawActionBtn(btnSpeedDown, "#374151");
        drawActionBtn(btnSpeedUp, "#374151");
        drawActionBtn(btnMatchLocker, "#2563EB");
        drawActionBtn(btnMatchSub, "#D97706");

        ctx.fillStyle = "#FACC15";
        let statusDisplay = `상황: ${gameStatusText}`;
        ctx.fillText(statusDisplay, SCREEN_WIDTH - ctx.measureText(statusDisplay).width - 40, 70);
    }

    requestAnimationFrame(gameLoop);
}

function drawBtn(rect, label, isSelected) {
    let isHover = isInside(mousePos, rect);
    ctx.fillStyle = isSelected ? COLOR_BUTTON_ACTIVE : (isHover ? COLOR_BUTTON_HOVER : COLOR_BUTTON);
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = "#FFFFFF"; ctx.font = "12px 'Pretendard', sans-serif";
    ctx.fillText(label, rect.x + 18, rect.y + 20);
}

function drawActionBtn(btn, bgColor) {
    let isHover = isInside(mousePos, btn);
    ctx.fillStyle = isHover ? "#60A5FA" : bgColor;
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 13px 'Pretendard', sans-serif";
    let textW = ctx.measureText(btn.label).width;
    ctx.fillText(btn.label, btn.x + (btn.w - textW) / 2, btn.y + (btn.h / 2) + 4);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
