<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}관리자{% endblock %}</title>
<style>
  :root{--bd:#d0d7de;--bg:#f6f8fa;--err:#c0392b;--warn:#b9770e;--info:#2874a6;--ok:#1e8449}
  body{font-family:system-ui,'Malgun Gothic',sans-serif;margin:0;color:#1f2328}
  nav{background:#24292f;padding:12px 24px;display:flex;gap:20px}
  nav a{color:#fff;text-decoration:none;font-weight:600}
  main{padding:24px;max-width:1100px;margin:0 auto}
  table{border-collapse:collapse;width:100%;margin:12px 0}
  th,td{border:1px solid var(--bd);padding:6px 10px;text-align:left;vertical-align:top;font-size:14px}
  th{background:var(--bg)}
  .num{text-align:right}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
  .card{border:1px solid var(--bd);border-radius:8px;padding:10px 16px;min-width:110px}
  .card b{display:block;font-size:22px}
  .error{color:var(--err)} .warn{color:var(--warn)} .info{color:var(--info)} .ok{color:var(--ok)} .fix{color:#6c3483}
  .old{color:#a93226;text-decoration:line-through} .new{color:#1e8449;font-weight:600}
  .box{border:1px solid var(--bd);border-radius:8px;padding:10px 16px;margin:12px 0;background:var(--bg)}
  .cols{display:flex;gap:16px;flex-wrap:wrap} .cols>div{flex:1;min-width:240px}
  code{background:#eaeef2;padding:1px 5px;border-radius:4px}
  .msg{padding:10px 14px;border-radius:6px;margin-bottom:12px;background:var(--bg);border:1px solid var(--bd)}
  button,.btn{background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:9px 18px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
  details{margin:8px 0}
  small{color:#57606a}
</style>
</head>
<body>
<nav>
  <a href="{% url 'manager:dashboard' %}">현황</a>
  <a href="{% url 'manager:import_upload' %}">데이터 추가</a>
  <a href="{% url 'manager:history' %}">반영 기록</a>
  <a href="{% url 'manager:scoring' %}">점수 기준</a>
  <a href="{% url 'manager:exclusions' %}">제외 선수</a>
  <a href="{% url 'manager:backups' %}">백업</a>
  <a href="/admin/">Django 관리</a>
</nav>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
